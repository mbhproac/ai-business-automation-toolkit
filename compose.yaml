services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - toolkit-data:/app/data
      - ./workflows:/app/workflows:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    restart: unless-stopped
    command: ["aibat", "worker"]
    env_file: .env
    volumes:
      - toolkit-data:/app/data
      - ./workflows:/app/workflows:ro
volumes:
  toolkit-data:
