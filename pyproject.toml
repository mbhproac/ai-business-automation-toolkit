[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-business-automation-toolkit"
version = "0.1.0"
description = "Secure, extensible business event automation with optional AI enrichment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Community Contributors"}]
keywords = ["automation", "webhooks", "workflows", "business", "ai"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "build>=1,<2", "pip-audit>=2,<3"]

[project.scripts]
aibat = "ai_business_automation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_business_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
